
name: Test GHCR Push

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/Dockerfile"
      - ".github/workflows/ghcr-test.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/YOUR_GITHUB_USERNAME/nsee-ghcr-test:latest
